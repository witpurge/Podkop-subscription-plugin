name: Release

# a pushed version tag builds and publishes the release, so github-actions[bot] is its author
on:
  push:
    tags:
      # GitHub's tag filters are globs, not regexes; the exact shape is checked in the version job
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  version:
    name: check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # the tag is the whole plugin version now; the podkop it targets is stamped by the build
      - name: Refuse a tag that is not <major>.<minor>.<patch>
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not <major>.<minor>.<patch>, nothing was built"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.format }}
    runs-on: ubuntu-24.04
    needs: version
    strategy:
      # one format per runner: building both on one host is what ran it out of memory locally
      fail-fast: false
      matrix:
        format: [ipk, apk]
    steps:
      - uses: actions/checkout@v5.0.0

      # the default docker driver cannot export a cache, so the container driver is required
      - uses: docker/setup-buildx-action@v3.11.1

      # podkop-sub: the Dockerfiles are one RUN, so the cache holds the SDK image but not the
      # dependency build; split the RUN once local builds are BuildKit-only (podman is not)
      - name: Build the ${{ matrix.format }} package
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile-${{ matrix.format }}
          build-args: PODKOP_SUB_VERSION=${{ needs.version.outputs.version }}
          tags: podkop-sub:ci-${{ matrix.format }}
          load: true
          cache-from: type=gha,scope=${{ matrix.format }}
          cache-to: type=gha,mode=max,scope=${{ matrix.format }}

      # same extraction as build.sh: the SDK image runs unprivileged, so copy out of a container
      - name: Extract the package
        run: |
          mkdir -p dist
          cid=$(docker create podkop-sub:ci-${{ matrix.format }} true)
          docker cp "$cid:/tmp/out/." dist/
          docker rm -f "$cid"
          ls -l dist

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: packages-${{ matrix.format }}
          path: dist/*.${{ matrix.format }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: publish the release
    runs-on: ubuntu-24.04
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      # install.sh is fetched from releases/latest/download/install.sh, so it is an asset too
      - run: cp install.sh uninstall.sh dist/

      # gh is preinstalled and needs no token beyond the automatic one, which makes the bot the author
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes dist/* ||
            gh release upload "$TAG" --clobber dist/*

      # install.sh picks a release by the podkop stamped into its asset names, so an unstamped
      # release is uninstallable and must fail loudly rather than sit there
      - name: Check the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          for ext in ipk apk; do
            if ! printf '%s\n' "$names" | grep -qE "podkop[0-9][^ ]*\.$ext\$"; then
              echo "::error::the release has no .$ext package naming the podkop it was built for"
              exit 1
            fi
          done
